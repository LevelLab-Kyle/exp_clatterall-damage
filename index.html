<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>ClatterAll Damage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;700&display=fallback" />
    <!-- The ?v= on each local file is a cache buster: /deploy swaps the placeholder for the commit hash. -->
    <link rel="stylesheet" href="src/style.css?v=__VERSION__" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <nav id="modes" class="modes">
          <button id="mode-levels" class="mode" data-mode="levels">Levels</button>
          <button id="mode-sandbox" class="mode" data-mode="sandbox">Sandbox</button>
        </nav>
        <div class="level-info">
          <button id="btn-levels" class="button" title="Pick a level">☰</button>
          <span id="level-title" class="level-title"></span>
        </div>
        <div class="examples">
          <label for="examples" class="muted">Examples</label>
          <select id="examples"></select>
        </div>
        <div class="controls">
          <button id="btn-undo" class="button" title="Undo (Cmd/Ctrl+Z)" disabled>↶ Undo</button>
          <button id="btn-redo" class="button" title="Redo (Shift+Cmd/Ctrl+Z)" disabled>↷ Redo</button>
          <button id="btn-play" class="button button-accent">▶ Play</button>
          <button id="btn-reset" class="button button-accent" hidden>↺ Reset</button>
        </div>
      </header>

      <div id="stage">
        <canvas id="scene"></canvas>
        <div id="view-tools">
          <button id="btn-home" class="button-icon" title="Fit everything on screen (H)" aria-label="Home"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7.5L8 2.5l6 5"/><path d="M3.5 6.5V13.5h9V6.5"/><path d="M6.5 13.5v-4h3v4"/></svg></button>
          <button id="btn-lock" class="button-icon on" title="Up/down scrolling is locked (click to unlock)" aria-label="Lock up and down scrolling" aria-pressed="true"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1"/><path class="shackle" d="M5 7V5a3 3 0 0 1 6 0v2"/></svg></button>
          <button id="btn-clear" class="button-icon" title="Clear the board" aria-label="Clear"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11"/><path d="M6 4V2.5h4V4"/><path d="M4 4l.75 9.5h6.5L12 4"/><path d="M6.75 6.5v4.5M9.25 6.5v4.5"/></svg></button>
          <div id="clear-confirm" class="card" hidden>
            <div class="title">Are you sure?</div>
            <div id="clear-text" class="muted"></div>
            <div class="confirm-buttons">
              <button id="clear-cancel" class="button">Cancel</button>
              <button id="clear-yes" class="button button-danger">Clear</button>
            </div>
          </div>
        </div>
        <div id="item-tools" hidden>
          <button id="tool-rotate" class="button-icon" title="Rotate (R)"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M12 1.5v3h-3"/></svg></button>
          <button id="tool-size" class="button-icon" title="Size (S)"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 14L14 2"/><path d="M9 2h5v5"/><path d="M7 14H2V9"/></svg></button>
          <button id="tool-flip" class="button-icon" title="Flip (F)"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v12"/><path d="M6 4L2 12h4z"/><path d="M10 4l4 8h-4z"/></svg></button>
          <button id="tool-delete" class="button-icon" title="Delete">🗑</button>
        </div>
        <div id="toast" hidden></div>
        <div id="win-card" class="card" hidden>
          <div class="win-star">⭐</div>
          <div id="win-title" class="title"></div>
          <div id="win-text" class="muted"></div>
          <div class="win-buttons">
            <button id="win-again" class="button">↺ Try again</button>
            <button id="win-next" class="button button-accent">Next level ▶</button>
          </div>
        </div>
        <div id="level-picker" hidden>
          <div class="picker-panel card">
            <div class="picker-head">
              <div class="title">Levels</div>
              <button id="picker-close" class="button-icon" title="Close">✕</button>
            </div>
            <div id="level-grid"></div>
          </div>
        </div>
      </div>

      <footer id="tray">
        <div id="tray-label" class="tray-label">Drag a gadget onto the board</div>
        <div class="tray-row">
          <button id="tray-prev" class="button-icon" title="Previous gadgets">‹</button>
          <div id="gadget-list"><div id="gadget-track"></div></div>
          <button id="tray-next" class="button-icon" title="More gadgets">›</button>
        </div>
      </footer>
    </div>
    <script src="vendor/libs.js?v=__VERSION__"></script>
    <script src="assets/sounds.js?v=__VERSION__"></script>
    <script src="src/gadgets.js?v=__VERSION__"></script>
    <script src="src/examples.js?v=__VERSION__"></script>
    <script src="src/levels.js?v=__VERSION__"></script>
    <script src="src/main.js?v=__VERSION__"></script>
  </body>
</html>
