<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Clatter Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;700&display=fallback" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand title">Clatter Lab</div>
        <div class="examples">
          <label for="examples" class="muted">Examples</label>
          <select id="examples"></select>
        </div>
        <div class="controls">
          <button id="btn-undo" class="button" title="Undo (Cmd/Ctrl+Z)" disabled>↶ Undo</button>
          <button id="btn-redo" class="button" title="Redo (Shift+Cmd/Ctrl+Z)" disabled>↷ Redo</button>
          <button id="btn-play" class="button button-accent">▶ Play</button>
          <button id="btn-reset" class="button button-accent" hidden>↺ Reset</button>
          <button id="btn-clear" class="button" title="Remove everything">Clear</button>
          <button id="btn-home" class="button" title="Recenter the view (H)">Home</button>
          <button id="btn-view" class="button" title="Switch between flat and 3D views">3D view</button>
          <button id="btn-sound" class="button-icon" title="Sound on/off">🔊</button>
        </div>
      </header>

      <div id="stage">
        <canvas id="scene"></canvas>
        <div id="item-tools" hidden>
          <div class="tool-group" data-group="rotate">
            <button class="tool-head button-icon" title="Rotate and flip"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M12 1.5v3h-3"/></svg></button>
            <div class="tool-pop">
              <button id="tool-flip-v" class="button-icon" title="Flip up-down (Shift+F)">⇕</button>
              <button id="tool-flip-h" class="button-icon" title="Flip left-right (F)">⇔</button>
              <button id="tool-rotate-cw" class="button-icon" title="Rotate clockwise (Shift+R)">↻</button>
              <button id="tool-rotate-ccw" class="button-icon" title="Rotate counter-clockwise (R)">↺</button>
            </div>
          </div>
          <div class="tool-group" data-group="scale">
            <button class="tool-head button-icon" title="Size"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 14L14 2"/><path d="M9 2h5v5"/><path d="M7 14H2V9"/></svg></button>
            <div class="tool-pop">
              <button id="tool-taller" class="button-icon" title="Taller by a quarter"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(90 8 8)"><path d="M8 3v10"/><path d="M1 8h4M1 8l2-2M1 8l2 2M15 8h-4M15 8l-2-2M15 8l-2 2"/></g></svg></button>
              <button id="tool-shorter" class="button-icon" title="Shorter by a quarter"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(90 8 8)"><path d="M8 3v10"/><path d="M1 8h4M5 8l-2-2M5 8l-2 2M15 8h-4M11 8l2-2M11 8l2 2"/></g></svg></button>
              <button id="tool-wider" class="button-icon" title="Wider by a quarter"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g><path d="M8 3v10"/><path d="M1 8h4M1 8l2-2M1 8l2 2M15 8h-4M15 8l-2-2M15 8l-2 2"/></g></svg></button>
              <button id="tool-narrower" class="button-icon" title="Narrower by a quarter"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g><path d="M8 3v10"/><path d="M1 8h4M5 8l-2-2M5 8l-2 2M15 8h-4M11 8l2-2M11 8l2 2"/></g></svg></button>
            </div>
          </div>
          <div class="tool-group" data-group="move">
            <button class="tool-head button-icon" title="Nudge a quarter cell"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1v14M1 8h14"/><path d="M6 3l2-2 2 2M6 13l2 2 2-2M3 6L1 8l2 2M13 6l2 2-2 2"/></svg></button>
            <div class="tool-pop">
              <button id="tool-nudge-up" class="button-icon" title="Up a quarter (↑)"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4"/></svg></button>
              <button id="tool-nudge-down" class="button-icon" title="Down a quarter (↓)"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M4 9l4 4 4-4"/></svg></button>
              <button id="tool-nudge-right" class="button-icon" title="Right a quarter (→)"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
              <button id="tool-nudge-left" class="button-icon" title="Left a quarter (←)"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg></button>
            </div>
          </div>
          <button id="tool-delete" class="button-icon" title="Delete">🗑</button>
        </div>
        <div id="toast" hidden></div>
      </div>

      <footer id="tray">
        <div class="tray-label">Drag a gadget onto the board</div>
        <div class="tray-row">
          <button id="tray-prev" class="button-icon" title="Previous gadgets">‹</button>
          <div id="gadget-list"><div id="gadget-track"></div></div>
          <button id="tray-next" class="button-icon" title="More gadgets">›</button>
        </div>
      </footer>
    </div>
    <script src="vendor/libs.js"></script>
    <script src="assets/sounds.js"></script>
    <script src="src/gadgets.js"></script>
    <script src="src/examples.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
