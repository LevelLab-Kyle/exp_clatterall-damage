<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gadget Garage</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">Gadget Garage</div>
        <div class="examples">
          <label for="examples">Examples</label>
          <select id="examples"></select>
        </div>
        <div class="controls">
          <button id="btn-undo" title="Undo (Cmd/Ctrl+Z)" disabled>↶ Undo</button>
          <button id="btn-redo" title="Redo (Shift+Cmd/Ctrl+Z)" disabled>↷ Redo</button>
          <button id="btn-play" class="big primary">▶ Play</button>
          <button id="btn-reset" class="big" hidden>↺ Reset</button>
          <button id="btn-clear" title="Remove everything">🗑 Clear</button>
          <button id="btn-home" title="Recenter the view (H)">⌂ Home</button>
          <button id="btn-view" title="Switch between flat and 3D views">3D view</button>
        </div>
      </header>

      <div id="stage">
        <canvas id="scene"></canvas>
        <div id="item-tools" hidden>
          <button id="tool-rotate-ccw" title="Rotate counter-clockwise (R)">↺</button>
          <button id="tool-rotate-cw" title="Rotate clockwise (Shift+R)">↻</button>
          <button id="tool-delete" title="Delete">🗑</button>
        </div>
        <div id="toast" hidden></div>
      </div>

      <footer id="tray">
        <div class="tray-label">Drag a gadget onto the board</div>
        <div id="gadget-list"></div>
      </footer>
    </div>
    <script src="vendor/libs.js"></script>
    <script src="src/gadgets.js"></script>
    <script src="src/examples.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
